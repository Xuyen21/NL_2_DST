# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: view performance

#evaluateOptions:
#  maxConcurrency: 10

providers:
  - id: file://provider_requests.py:one_phase_zeroshot_qwen
    config:
      model: qwen3.7-max
      provider: qwen-compatible
      base: QWEN_API_BASE
      label: Qwen3.7-Max
  - id: file://provider_requests.py:one_phase_zeroshot_deepseek
    config:
      model: deepseek-v4-flash
      provider: qwen-compatible
      base: QWEN_API_BASE
      label: DeepSeek v4 Flash
  - id: file://provider_requests.py:one_phase_zeroshot_glm
    config:
      model: glm-5.2
      provider: qwen-compatible
      base: QWEN_API_BASE
      label: GLM-5.2
  - id: file://provider_requests.py:one_phase_zeroshot_gpt
    config:
      model: gpt-5.4
      provider: openai
      label: Gpt-5.4
  - id: file://provider_requests.py:two_phase_zeroshot_deepseek
    config:
      model: deepseek-v4-flash
      provider: qwen-compatible
      base: QWEN_API_BASE
      label: DeepSeek v4 Flash
  - id: file://provider_requests.py:two_phase_zeroshot_qwen
    config:
      model: qwen3.7-max
      provider: qwen-compatible
      base: QWEN_API_BASE
      label: Qwen3.7-Max
  - id: file://provider_requests.py:two_phase_zeroshot_glm
    config:
      model: glm-5.2
      provider: qwen-compatible
      base: QWEN_API_BASE
      label: GLM-5.2
  - id: file://provider_requests.py:two_phase_zeroshot_gpt
    config:
      model: gpt-5.4
      provider: openai
      label: Gpt-5.4



tests:
  - vars:
      input:
        file://alphorn_text//alphorn-1.txt
      expected_output:
        file://alphorn-gold-standard//gold-alphorn-1.json

    assert: &grading_assert
      - type: python
        value: file://../scoring/grading.py:grading

  - vars:
      input:
        file://alphorn_text//alphorn-2.txt
      expected_output:
        file://alphorn-gold-standard//gold-alphorn-2.json
    assert: *grading_assert

